<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 智能助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --sidebar-bg: #f8f9fa;
            --main-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --input-bg: #ffffff;
            --success-color: #10b981;
        }

        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0; display: flex; height: 100vh;
            color: var(--text-primary); background-color: var(--main-bg);
        }

        /* Markdown 样式 */
        .markdown-body { font-size: 0.95rem; line-height: 1.6; }
        .markdown-body pre { background: #2d2d2d; color: #ccc; padding: 10px; border-radius: 6px; overflow-x: auto; }
        .markdown-body code { background: rgba(0, 0, 0, 0.05); padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .markdown-body th, .markdown-body td { border: 1px solid #ddd; padding: 6px; }

        /* 侧边栏 */
        .sidebar {
            width: 280px; background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; flex-shrink: 0;
        }
        .sidebar-header { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .btn-base {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .new-chat-btn { background-color: var(--primary-color); color: white; }
        .upload-btn { background-color: white; border: 1px solid var(--border-color); }
        .upload-btn.processing { color: var(--primary-color); cursor: wait; }

        .session-list { flex: 1; overflow-y: auto; padding: 10px; }
        .session-item {
            padding: 10px; margin-bottom: 4px; border-radius: 6px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
        }
        .session-item:hover { background-color: #e5e7eb; }
        .session-item.active { background-color: #dbeafe; color: var(--primary-color); }
        .del-session { color: #ef4444; opacity: 0; padding: 4px; }
        .session-item:hover .del-session { opacity: 1; }

        /* 主界面 */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .chat-header { height: 60px; padding: 0 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .message { display: flex; gap: 12px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .user .avatar { background: var(--primary-color); }
        .ai .avatar { background: #10b981; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; }
        .user .bubble { background: var(--primary-color); color: white; }
        .ai .bubble { background: #f3f4f6; }

        .docs-box { margin-top: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px; }
        .doc-item { background: #f9fafb; padding: 8px; border-left: 3px solid #10b981; margin-bottom: 5px; cursor: pointer; }
        .doc-content { font-size: 0.85rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .doc-item.expanded .doc-content { -webkit-line-clamp: unset; }

        .input-area { padding: 20px; border-top: 1px solid var(--border-color); }
        .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
        .input-wrapper input { flex: 1; padding: 12px; border: 1px solid #e5e7eb; border-radius: 25px; outline: none; }
        .send-btn { background: var(--primary-color); color: white; border: none; border-radius: 25px; padding: 0 20px; cursor: pointer; }

        /* 模态框 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal-container { background: white; width: 450px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .config-title { font-weight: bold; margin: 15px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="btn-base new-chat-btn" onclick="createNewSession()">+ 新对话</button>
            <button class="btn-base upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">上传知识库文件</button>
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)" multiple>
        </div>
        <div class="session-list" id="sessionList"></div>
        <div class="sidebar-footer" style="padding: 15px;">
            <button class="btn-base upload-btn" onclick="openSettings()">⚙️ RAG 设置</button>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-header">
            <div style="font-weight: 600;">RAG 助手</div>
            <div id="sessionIdDisplay" style="font-size: 0.8rem; color: #9ca3af;"></div>
        </div>
        <div class="messages-container" id="messagesList"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="输入问题...">
                <button id="sendBtn" class="send-btn" onclick="handleSend()">发送</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="configModal">
        <div class="modal-container">
            <h3 style="margin-top:0">RAG 参数配置</h3>
            <div class="config-title">知识库</div>
            <div class="input-group"><label>Collection</label><input type="text" id="collection" value="TestInfo_1024"></div>

            <div class="config-title">Embedding 模型 (用于上传)</div>
            <div class="input-group"><label>Provider</label><input type="text" id="emb_provider" value="siliconflow"></div>
            <div class="input-group"><label>Model Name</label><input type="text" id="emb_model" value="BAAI/bge-m3"></div>
            <div class="input-group"><label>Base URL</label><input type="text" id="emb_base_url" value="https://api.siliconflow.cn/v1/embeddings"></div>
            <div class="input-group"><label>API Key</label><input type="password" id="emb_key" placeholder="sk-..."></div>

            <div class="config-title">Chat LLM (用于对话)</div>
            <div class="input-group"><label>Provider</label><input type="text" id="llm_provider" value="openai"></div>
            <div class="input-group"><label>Model Name</label><input type="text" id="llm_model" value="Pro/zai-org/GLM-4.7"></div>
            <div class="input-group"><label>Base URL</label><input type="text" id="llm_base_url" value="https://api.siliconflow.cn/v1"></div>
            <div class="input-group"><label>API Key</label><input type="password" id="llm_key" placeholder="sk-..."></div>

            <button class="btn-base new-chat-btn" onclick="closeSettings()">保存并关闭</button>
        </div>
    </div>

    <script>
        const API_CHAT = "http://localhost:8000/stream_chat";
        const API_UPLOAD = "http://localhost:8000/upload_file";

        let sessions = JSON.parse(localStorage.getItem('rag_sessions') || '{}');
        let currentSessionId = localStorage.getItem('rag_active_id');

        // 初始化
        window.onload = () => {
            loadConfig();
            renderSessionList();
            if (currentSessionId && sessions[currentSessionId]) {
                switchSession(currentSessionId);
            } else {
                createNewSession();
            }
        };

        function openSettings() { document.getElementById('configModal').classList.add('show'); }
        function closeSettings() {
            saveConfig();
            document.getElementById('configModal').classList.remove('show');
        }

        function saveConfig() {
            const config = {
                collection: document.getElementById('collection').value,
                emb_provider: document.getElementById('emb_provider').value,
                emb_model: document.getElementById('emb_model').value,
                emb_base_url: document.getElementById('emb_base_url').value,
                emb_key: document.getElementById('emb_key').value,
                llm_provider: document.getElementById('llm_provider').value,
                llm_model: document.getElementById('llm_model').value,
                llm_base_url: document.getElementById('llm_base_url').value,
                llm_key: document.getElementById('llm_key').value
            };
            localStorage.setItem('rag_config', JSON.stringify(config));
        }

        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('rag_config') || '{}');
            if (config.collection) {
                for (let key in config) {
                    const el = document.getElementById(key);
                    if (el) el.value = config[key];
                }
            }
        }

        // ———————— 核心修复：文件上传函数 ————————
        async function handleFileUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            // 1. 实时获取所有表单值，确保字段名与后端一致
            const formData = new FormData();
            formData.append('collection', document.getElementById('collection').value);
            formData.append('embedding_base_url', document.getElementById('emb_base_url').value);
            formData.append('embedding_model_name', document.getElementById('emb_model').value);
            formData.append('embedding_api_key', document.getElementById('emb_key').value);
            formData.append('embedding_model_provider', document.getElementById('emb_provider').value);

            formData.append('chat_model', document.getElementById('llm_model').value);
            formData.append('chat_model_provider', document.getElementById('llm_provider').value);
            formData.append('chat_base_url', document.getElementById('llm_base_url').value);
            formData.append('chat_api_key', document.getElementById('llm_key').value);

            // 2. 添加文件
            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            // 3. 校验关键字段
            if (!document.getElementById('emb_key').value) {
                alert("请先填写 Embedding API Key！");
                return;
            }

            const btn = document.getElementById('uploadBtn');
            btn.innerText = "正在入库...";
            btn.disabled = true;

            try {
                const response = await fetch(API_UPLOAD, {
                    method: 'POST',
                    body: formData // 浏览器会自动设置 Content-Type: multipart/form-data
                });

                if (response.ok) {
                    const res = await response.json();
                    alert("✅ 上传成功：" + (res.message || "文件已处理"));
                } else {
                    const err = await response.json();
                    alert("❌ 失败 (422/500)：" + JSON.stringify(err.detail || err.message));
                }
            } catch (e) {
                alert("❌ 网络连接失败：" + e.message);
            } finally {
                btn.innerText = "上传知识库文件";
                btn.disabled = false;
                event.target.value = '';
            }
        }

        // ———————— 聊天逻辑 ————————
        function createNewSession() {
            const id = Date.now().toString();
            sessions[id] = { title: "新对话", messages: [] };
            switchSession(id);
        }

        function switchSession(id) {
            currentSessionId = id;
            localStorage.setItem('rag_active_id', id);
            renderSessionList();
            renderMessages();
        }

        function renderSessionList() {
            const list = document.getElementById('sessionList');
            list.innerHTML = '';
            Object.keys(sessions).reverse().forEach(id => {
                const item = document.createElement('div');
                item.className = `session-item ${id === currentSessionId ? 'active' : ''}`;
                item.innerHTML = `<span>${sessions[id].title}</span>`;
                item.onclick = () => switchSession(id);
                list.appendChild(item);
            });
        }

        function renderMessages() {
            const container = document.getElementById('messagesList');
            container.innerHTML = '';
            const msgs = sessions[currentSessionId].messages;
            msgs.forEach(m => appendMessageDOM(m.role, m.content, m.docs));
            container.scrollTop = container.scrollHeight;
        }

        function appendMessageDOM(role, content, docs = []) {
            const container = document.getElementById('messagesList');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? 'U' : 'AI'}</div>
                <div class="bubble">
                    <div class="markdown-body">${marked.parse(content)}</div>
                    ${docs.length ? '<div class="docs-box">📚 参考了 ' + docs.length + ' 条数据</div>' : ''}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        async function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            const session = sessions[currentSessionId];
            session.messages.push({ role: 'user', content: text });
            if (session.title === "新对话") session.title = text.substring(0, 10);

            renderMessages();
            const aiDiv = appendMessageDOM('ai', '正在思考...');
            const bubble = aiDiv.querySelector('.markdown-body');

            const payload = {
                session_id: currentSessionId,
                message: text,
                collection: document.getElementById('collection').value,
                embedding: {
                    base_url: document.getElementById('emb_base_url').value,
                    model_name: document.getElementById('emb_model').value,
                    api_key: document.getElementById('emb_key').value,
                    model_provider: document.getElementById('emb_provider').value
                },
                chat_config: {
                    model: document.getElementById('llm_model').value,
                    model_provider: document.getElementById('llm_provider').value,
                    base_url: document.getElementById('llm_base_url').value,
                    api_key: document.getElementById('llm_key').value
                }
            };

            try {
                const res = await fetch(API_CHAT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const reader = res.body.getReader();
                let fullText = "";
                bubble.innerHTML = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = new TextDecoder().decode(value);
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (!line.trim()) continue;
                        const data = JSON.parse(line);
                        if (data.type === 'text') {
                            fullText += data.data;
                            bubble.innerHTML = marked.parse(fullText);
                        }
                    }
                }
                session.messages.push({ role: 'ai', content: fullText });
                localStorage.setItem('rag_sessions', JSON.stringify(sessions));
            } catch (e) {
                bubble.innerHTML = "❌ 发生错误：" + e.message;
            }
        }
    </script>
</body>
</html>
